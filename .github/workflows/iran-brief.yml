name: Iran War Update

# Runs the daily pipeline (collect -> digest -> render -> deliver) that lives in
# pipeline/. On a schedule it drafts the brief and emails it to REVIEWER_EMAIL; it
# also uploads the brief as a downloadable artifact and commits the SQLite archive
# back to the repo so the queryable corpus (and weekly trends) persist across runs.

on:
  schedule:
    # 12:10 UTC on weekdays = 8:10 AM ET during EDT (7:10 AM during EST). GitHub delays
    # scheduled runs (often 30-60+ min) and the pipeline itself takes ~15 min, so we start
    # ~50 min early and off the top of the hour to land the brief around 9:00 AM ET.
    - cron: "10 12 * * 1-5"
    # Backup slots at ~1, 2, and 3 hours later. GitHub's scheduled crons are best-effort and can
    # DROP a slot — or, as on 2026-08-28, every slot in a morning — so we stagger several attempts.
    # The once-per-day delivery guard (deliver.py) makes each later slot a no-op once one has
    # already sent, so at most one brief goes out per calendar day no matter how many slots fire.
    # These GitHub crons are a free redundant layer; the reliable trigger is the external
    # scheduler in docs/RELIABLE_SCHEDULING.md, which hits workflow_dispatch on time.
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "10 15 * * 1-5"
  workflow_dispatch:
    inputs:
      digest_to:
        description: "Override recipient(s) for this run only (comma-separated). Blank = default list."
        required: false
        default: ""

# Needed so the "Commit archive" step can push data/archive.db back to the branch.
permissions:
  contents: write

# Never let two runs push the archive at the same time.
concurrency:
  group: iran-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Chromium for the Al Jazeera liveblog render (see _render_liveblog_html). Best-effort:
          # if this fails the pipeline still runs, just without the browser-rendered liveblog.
          python -m playwright install --with-deps chromium || \
            echo "playwright chromium install failed; liveblog browser render disabled"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: powers the "U.S. Congress" section (free key at api.congress.gov).
          # Unset -> the section is simply omitted.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          # Optional: paid X scraper for officials' tweets (e.g. twitterapi.io). Unset -> the
          # tool falls back to the free syndication pull (which X blocks from CI, so ~empty).
          X_SCRAPER_KEY: ${{ secrets.X_SCRAPER_KEY }}
          X_SCRAPER_BASE: ${{ vars.X_SCRAPER_BASE }}
          # Gmail delivery (same secret names as the Korea/Japan digests).
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          # Manual runs can override the recipient via the digest_to input (send just to
          # yourself for a test); a blank input falls back to the default DIGEST_TO list.
          DIGEST_TO: ${{ github.event.inputs.digest_to || secrets.DIGEST_TO }}
          # An override run (a manual test to a custom recipient) is a resend: it bypasses the
          # once-per-day delivery guard and does not mark the day delivered, so it neither is
          # blocked by nor blocks the real scheduled send. Empty for scheduled/normal runs.
          ALLOW_RESEND: ${{ github.event.inputs.digest_to != '' && '1' || '' }}
          # Generic SMTP delivery (original Iran config; used only if Gmail is unset).
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Optional Outlook (Microsoft Graph) draft delivery; used only when all four are set.
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_MAILBOX: ${{ secrets.MS_MAILBOX }}
          # These are passed through only when set, so an unset/empty value does not shadow
          # the code's built-in default (SMTP_PORT -> 587, models -> the digest.py defaults).
          # An empty SMTP_PORT would otherwise reach int("") in deliver.py and crash.
          SMTP_PORT_VAR: ${{ secrets.SMTP_PORT }}
          IRAN_BRIEF_MODEL_VAR: ${{ vars.IRAN_BRIEF_MODEL }}
          IRAN_BRIEF_PRIMARY_MODEL_VAR: ${{ vars.IRAN_BRIEF_PRIMARY_MODEL }}
        run: |
          if [ -n "${SMTP_PORT_VAR}" ]; then
            export SMTP_PORT="${SMTP_PORT_VAR}"
          fi
          if [ -n "${IRAN_BRIEF_MODEL_VAR}" ]; then
            export IRAN_BRIEF_MODEL="${IRAN_BRIEF_MODEL_VAR}"
          fi
          if [ -n "${IRAN_BRIEF_PRIMARY_MODEL_VAR}" ]; then
            export IRAN_BRIEF_PRIMARY_MODEL="${IRAN_BRIEF_PRIMARY_MODEL_VAR}"
          fi
          python run.py

      - name: Upload brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iran-brief
          path: |
            pipeline/out/*.md
            pipeline/out/*.html
          if-no-files-found: warn

      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.db
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "chore: update news archive ($(date -u +%Y-%m-%d))"
            git push
          fi
