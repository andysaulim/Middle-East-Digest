name: Iran War Update

# Runs the daily pipeline (collect -> digest -> render -> deliver) that lives in
# pipeline/. On a schedule it drafts the brief and emails it to REVIEWER_EMAIL; it
# also uploads the brief as a downloadable artifact and commits the SQLite archive
# back to the repo so the queryable corpus (and weekly trends) persist across runs.

on:
  schedule:
    # 11:30 UTC on weekdays. That is 7:30 AM ET during EDT (6:30 AM during EST).
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

# Needed so the "Commit archive" step can push data/archive.db back to the branch.
permissions:
  contents: write

# Never let two runs push the archive at the same time.
concurrency:
  group: iran-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # These two are passed through only when set, so an unset/empty value does not
          # shadow the code's built-in default (SMTP_PORT -> 587, model -> claude-sonnet-5).
          # An empty SMTP_PORT would otherwise reach int("") in deliver.py and crash.
          SMTP_PORT_VAR: ${{ secrets.SMTP_PORT }}
          IRAN_BRIEF_MODEL_VAR: ${{ vars.IRAN_BRIEF_MODEL }}
        run: |
          if [ -n "${SMTP_PORT_VAR}" ]; then
            export SMTP_PORT="${SMTP_PORT_VAR}"
          fi
          if [ -n "${IRAN_BRIEF_MODEL_VAR}" ]; then
            export IRAN_BRIEF_MODEL="${IRAN_BRIEF_MODEL_VAR}"
          fi
          python run.py

      - name: Upload brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iran-brief
          path: |
            pipeline/out/*.md
            pipeline/out/*.html
          if-no-files-found: warn

      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.db
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "chore: update news archive ($(date -u +%Y-%m-%d))"
            git push
          fi
